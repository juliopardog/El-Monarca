<!DOCTYPE html>
<html lang="en" x-data="site()">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Monarca Steakhouse | Colombian Buffet · Norcross, GA">

  <!-- Fonts: Oswald (bold headlines) + Cormorant Garamond (elegant italic) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,600;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ink':     '#0A0A0A',
            'surface': '#141414',
            'card':    '#1C1C1C',
            'gold':    '#C9A84C',
            'gold-lt': '#E8C96A',
            'ember':   '#D4601A',
            'cream':   '#F2EDE4',
            'muted':   '#6B6358',
            'edge':    '#252525',
          },
          fontFamily: {
            display: ['Oswald', 'sans-serif'],
            accent:  ['Cormorant Garamond', 'serif'],
            body:    ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #0A0A0A; color: #F2EDE4; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

    /* Gold gradient text */
    .gold-text {
      background: linear-gradient(135deg, #a07828 0%, #E8C96A 40%, #C9A84C 70%, #a07828 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Dividers */
    .rule-gold  { height: 1px; background: linear-gradient(to right, transparent, #C9A84C 30%, #C9A84C 70%, transparent); }
    .rule-dark  { height: 1px; background: linear-gradient(to right, transparent, #252525 30%, #252525 70%, transparent); }

    /* Eyebrow label */
    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #C9A84C;
    }

    /* Nav blur */
    .nav-blur { backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }

    /* ── HERO: true split layout ── */
    .hero-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }
    @media (max-width: 768px) {
      .hero-wrap { grid-template-columns: 1fr; grid-template-rows: 55vw 1fr; }
    }

    .hero-text-panel {
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 7rem 4rem 5rem 4rem;
      position: relative;
      z-index: 2;
    }
    @media (max-width: 1024px) { .hero-text-panel { padding: 6rem 2.5rem 4rem; } }
    @media (max-width: 768px)  { .hero-text-panel { padding: 3rem 1.5rem 4rem; justify-content: flex-start; } }

    .hero-image-panel {
      position: relative;
      overflow: hidden;
    }
    .hero-image-panel img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    /* Feather the left edge of the image into the dark panel */
    .hero-image-panel::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to right, #0A0A0A 0%, rgba(10,10,10,0.3) 25%, transparent 55%);
      z-index: 1;
      pointer-events: none;
    }

    /* Dish card */
    .dish-card { transition: transform 0.3s ease, border-color 0.3s ease; }
    .dish-card:hover { transform: translateY(-5px); border-color: rgba(201,168,76,0.55) !important; }
    .dish-card .thumb { transition: transform 0.6s ease; }
    .dish-card:hover .thumb { transform: scale(1.06); }

    /* Pricing card */
    .price-card {
      border: 1px solid rgba(201,168,76,0.2);
      background: rgba(28,28,28,0.85);
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .price-card:hover { border-color: rgba(201,168,76,0.65); transform: translateY(-6px); }

    /* Buttons */
    .btn-gold {
      background: #C9A84C; color: #0A0A0A;
      font-family: 'Oswald', sans-serif;
      font-weight: 600; font-size: 0.8rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 0.9rem 2.2rem; display: inline-block;
      transition: background 0.25s ease; text-align: center;
    }
    .btn-gold:hover { background: #E8C96A; }

    .btn-ghost {
      border: 1px solid rgba(242,237,228,0.3); color: #F2EDE4;
      font-family: 'Oswald', sans-serif;
      font-weight: 500; font-size: 0.8rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 0.9rem 2.2rem; display: inline-block;
      transition: border-color 0.25s ease, color 0.25s ease; text-align: center;
    }
    .btn-ghost:hover { border-color: #C9A84C; color: #C9A84C; }

    .btn-gold-outline {
      border: 1px solid rgba(201,168,76,0.35); color: #C9A84C;
      font-family: 'Oswald', sans-serif;
      font-weight: 500; font-size: 0.8rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 0.9rem 2.2rem; display: inline-flex; align-items: center; gap: 0.5rem;
      transition: border-color 0.25s ease, background 0.25s ease; justify-content: center;
    }
    .btn-gold-outline:hover { border-color: #C9A84C; background: rgba(201,168,76,0.07); }

    [x-cloak] { display: none !important; }

    /* Scroll cue */
    @keyframes bob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(6px)} }
    .bob { animation: bob 2s ease-in-out infinite; }

    /* Map mute */
    .map-wrap iframe { filter: grayscale(75%) brightness(0.88); }
  </style>
</head>
