<!DOCTYPE html>
<html lang="en" x-data="site()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monarca Steakhouse | Colombian Buffet · Norcross, GA</title>
  <meta name="description" content="All-you-can-eat Colombian rodizio buffet in Norcross, GA. Lechona, sancocho, fresh ceviche, and tableside carved meats. $22 Mon–Fri · $25 Sat–Sun.">
  <meta property="og:title" content="Monarca Steakhouse | Colombian Buffet · Norcross, GA">
  <meta property="og:description" content="Unlimited Colombian food. Rodizio-style tableside carving. $22 Mon–Fri, $25 weekends. 5705 Buford Hwy, Norcross GA.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            black:    '#0A0A0A',
            surface:  '#141414',
            card:     '#1C1C1C',
            gold:     '#C9A84C',
            'gold-lt':'#E8C96A',
            orange:   '#E07B39',
            cream:    '#F5F0E8',
            muted:    '#7A7268',
            border:   '#2C2C2C',
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            body:    ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #0A0A0A; color: #F5F0E8; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

    /* Gold gradient text */
    .gold-text {
      background: linear-gradient(135deg, #b8922f 0%, #E8C96A 45%, #C9A84C 70%, #b8922f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Thin dividers */
    .rule-gold {
      height: 1px;
      background: linear-gradient(to right, transparent, #C9A84C 30%, #C9A84C 70%, transparent);
    }
    .rule-muted {
      height: 1px;
      background: linear-gradient(to right, transparent, #2C2C2C 30%, #2C2C2C 70%, transparent);
    }

    /* Section label */
    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #C9A84C;
    }

    /* Hero overlay — keeps Catrina visible, fades bottom */
    .hero-overlay {
      background: linear-gradient(
        to bottom,
        rgba(10,10,10,0.10) 0%,
        rgba(10,10,10,0.15) 25%,
        rgba(10,10,10,0.55) 58%,
        rgba(10,10,10,0.97) 100%
      );
    }

    /* Nav blur */
    .nav-bg { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

    /* Dish card */
    .dish-card { transition: border-color 0.3s ease, transform 0.3s ease; }
    .dish-card:hover { transform: translateY(-4px); border-color: rgba(201,168,76,0.5) !important; }
    .dish-card .thumb { transition: transform 0.6s ease; }
    .dish-card:hover .thumb { transform: scale(1.07); }

    /* Pricing card */
    .price-card {
      border: 1px solid rgba(201,168,76,0.25);
      background: rgba(28,28,28,0.8);
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .price-card:hover { border-color: rgba(201,168,76,0.7); transform: translateY(-6px); }

    /* Buttons */
    .btn-primary {
      background: #C9A84C;
      color: #0A0A0A;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 1rem 2.5rem;
      display: inline-block;
      transition: background 0.25s ease;
      text-align: center;
    }
    .btn-primary:hover { background: #E8C96A; }

    .btn-outline {
      border: 1px solid rgba(245,240,232,0.35);
      color: #F5F0E8;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 1rem 2.5rem;
      display: inline-block;
      transition: border-color 0.25s ease, color 0.25s ease;
      text-align: center;
    }
    .btn-outline:hover { border-color: #C9A84C; color: #C9A84C; }

    .btn-gold-outline {
      border: 1px solid rgba(201,168,76,0.4);
      color: #C9A84C;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 1rem 2.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: border-color 0.25s ease, background 0.25s ease;
      text-align: center;
      justify-content: center;
    }
    .btn-gold-outline:hover { border-color: #C9A84C; background: rgba(201,168,76,0.08); }

    /* Mobile menu overlay */
    [x-cloak] { display: none !important; }

    /* Scroll indicator pulse */
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(6px); } }
    .bob { animation: bob 1.8s ease-in-out infinite; }

    /* Map desaturate */
    .map-wrap iframe { filter: grayscale(70%) contrast(1.05) brightness(0.9); }

    /* Floral side accents */
    .floral-left, .floral-right {
      position: absolute; top: 0; width: 90px; height: 100%;
      background-image: url('./assets/images/floral-frame.png');
      background-size: cover; pointer-events: none; opacity: 0.18;
    }
    .floral-left { left: 0; background-position: left center; }
    .floral-right { right: 0; background-position: right center; transform: scaleX(-1); }
  </style>
</head>

<body class="font-body">

        <span class="eyebrow" style="font-size:0.55rem; letter-spacing:0.25em;">Steakhouse · Bar &amp; Grill</span>

      <!-- Desktop links -->

        <a href="#menu"       class="text-muted hover:text-cream text-xs tracking-widest uppercase transition-colors" x-text="t('nav_menu')"></a>
        <a href="#pricing"    class="text-muted hover:text-cream text-xs tracking-widest uppercase transition-colors" x-text="t('nav_price')"></a>

        <button @click="open = !open" class="text-cream" :aria-expanded="open" aria-controls="mobile-menu" aria-label="Toggle menu">

          <i x-show="open"  class="fa-solid fa-xmark text-xl" x-cloak></i>

    </div>

    <!-- Mobile menu -->

         x-transition:enter-start="opacity-0 -translate-y-2"

      <a href="tel:4708078879" @click="open=false" class="btn-primary w-full mt-2" x-text="t('nav_cta')"></a>
    </div>
